syntax = "proto3";

package app.keyholm.store.proto;

import "google/protobuf/timestamp.proto";
import "passkeys.proto";

option java_package = "app.keyholm.store.proto";
option java_multiple_files = true;

message MigrationPlaceholdersProto {
  repeated MigrationPlaceholderProto placeholders = 1;
}

message MigrationPlaceholderProto {
  RelyingPartyProto rp = 1;
  string user_name = 2;
  string display_name = 3;
  google.protobuf.Timestamp original_created_at = 4;
}
