syntax = "proto3";

package app.keyholm.store.proto;

import "google/protobuf/timestamp.proto";

option java_package = "app.keyholm.store.proto";
option java_multiple_files = true;

message DeniedNativeAppsProto {
  repeated DeniedNativeAppProto denied = 1;
  map<string, AcceptedAppListProto> accepted = 2;
}

message DeniedNativeAppProto {
  string package_name = 1;
  string rp_id = 2;
  repeated string sha256_cert_fingerprints_hex = 3;
  google.protobuf.Timestamp last_denied_at = 4;
  int32 denial_count = 5;
}

message AcceptedAppListProto {
  repeated AcceptedAppProto apps = 1;
}

message AcceptedAppProto {
  string package_name = 1;
  string sha256_cert_fingerprint_hex = 2;
}
