name: Bump version

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bump versionCode and versionName
        id: bump
        run: |
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          IFS=. read -r major minor patch <<< "$name"
          case "${{ inputs.release }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next_name="$major.$minor.$patch"
          sed -i \
            -e "s/versionCode = $code/versionCode = $((code + 1))/" \
            -e "s/versionName = \"$name\"/versionName = \"$next_name\"/" \
            app/build.gradle.kts
          {
            echo "name=$name"
            echo "next_name=$next_name"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"
      - name: Open draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="bump-version-${{ steps.bump.outputs.next_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "chore: bump version to ${{ steps.bump.outputs.next_name }}"
          git push -u origin "$branch"
          gh pr create \
            --draft \
            --base "${{ github.ref_name }}" \
            --head "$branch" \
            --title "chore: bump version to ${{ steps.bump.outputs.next_name }}" \
            --body "versionCode ${{ steps.bump.outputs.code }} -> $(( ${{ steps.bump.outputs.code }} + 1 )), versionName ${{ steps.bump.outputs.name }} -> ${{ steps.bump.outputs.next_name }}."
