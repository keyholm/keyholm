name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read release tag from build.gradle.kts
        id: version
        run: |
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          tag="v$name"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
          minimum_release_age: 7d
      - name: Check formatting, lint and test
        run: gradle check
      - name: Build unsigned release APK
        run: gradle assembleRelease
      - name: Stage unsigned APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/keyholm-unsigned.apk dist/
          sum=$(sha256sum dist/keyholm-unsigned.apk | cut -d' ' -f1)
          echo "::notice title=Unsigned APK sha256::$sum"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Cosign the unsigned APK
        run: |
          cosign sign-blob --yes \
            --bundle dist/keyholm-unsigned.apk.sigstore.json \
            dist/keyholm-unsigned.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keyholm-unsigned.apk
          archive: false
          path: dist/keyholm-unsigned.apk
      - name: Create draft release with unsigned APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          cat > dist/notes.md <<EOF
          ## Artifacts

          | | |
          |-|-|
          | \`keyholm.apk\` | the release APK, signed with the release key |
          | \`keyholm-unsigned.apk\` | the reproducible build output, before signing |
          | \`keyholm-unsigned.apk.sigstore.json\` | keyless Sigstore bundles proving the APK was produced by this workflow |
          | \`keyholm.apk.sigstore.json\` | keyless Sigstore bundles proving the APK was verified by this workflow |

          The signed APK's ZIP payload is byte-identical to \`keyholm-unsigned.apk\`.
          Only the APK Signing Block differs. See the workflow run for the recorded SHA-256 of each.

          ## Verify the Sigstore bundles

          Install [cosign](https://docs.sigstore.dev/cosign/installation/):

          \`\`\`bash
          SHA=${SHA}
          # Or if you have a local clone
          # SHA=\$(git rev-parse "${TAG}^{commit}")

          gh release download ${TAG}

          cosign verify-blob \\
            --bundle keyholm.apk.sigstore.json \\
            --certificate-identity-regexp '^https://github\.com/${REPO}/\.github/workflows/release\.yml@' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-github-workflow-sha \$SHA \\
            keyholm.apk

          cosign verify-blob \\
            --bundle keyholm-unsigned.apk.sigstore.json \\
            --certificate-identity-regexp '^https://github\.com/${REPO}/\.github/workflows/release\.yml@' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-github-workflow-sha \$SHA \\
            keyholm-unsigned.apk
          \`\`\`

          ## Verify the APK signature

          \`\`\`bash
          apksigner verify --print-certs -v keyholm.apk
          \`\`\`

          ## Verify reproducibility

          \`\`\`bash
          git checkout ${TAG}
          mise install
          mise exec -- gradle assembleRelease

          sha256sum keyholm-unsigned.apk app/build/outputs/apk/release/keyholm-unsigned.apk
          \`\`\`
          EOF

          gh release create "$TAG" \
            --draft \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes-file dist/notes.md \
            dist/keyholm-unsigned.apk dist/keyholm-unsigned.apk.sigstore.json

  verify:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download unsigned and signed APKs from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ needs.build.outputs.tag }}" --repo "${{ github.repository }}" \
            --pattern keyholm-unsigned.apk --dir dist
          gh release download "${{ needs.build.outputs.tag }}" --repo "${{ github.repository }}" \
            --pattern keyholm.apk --dir dist
      - name: Put apksigner on PATH
        run: ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1 >> "$GITHUB_PATH"
      - name: Install apksigcopier
        run: pipx install apksigcopier
      - name: Signed APK differs from the reproducible build only by its signature
        run: |
          unsigned=$(sha256sum dist/keyholm-unsigned.apk | cut -d' ' -f1)
          signed=$(sha256sum dist/keyholm.apk | cut -d' ' -f1)
          echo "::notice title=Unsigned APK sha256::$unsigned"
          echo "::notice title=Signed APK sha256::$signed"
          apksigcopier compare dist/keyholm.apk dist/keyholm-unsigned.apk --unsigned
          echo "OK: signed release matches the unsigned reproducible build"
      - name: Show signer certificate
        run: apksigner verify --print-certs -v dist/keyholm.apk
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Cosign the signed APK (keyless)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cosign sign-blob --yes \
            --bundle dist/keyholm.apk.sigstore.json \
            dist/keyholm.apk
          gh release upload "${{ needs.build.outputs.tag }}" --repo "${{ github.repository }}" \
            dist/keyholm.apk.sigstore.json
