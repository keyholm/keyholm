name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      unsigned_sha256: ${{ steps.stage.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Read release tag from build.gradle.kts
        id: version
        run: |
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          tag="v$name"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::tag $tag already exists"
            exit 1
          fi
          previous=$(git describe --tags --abbrev=0 --match 'v*')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous" >> "$GITHUB_OUTPUT"
      - name: Ensure a changelog exists for this version
        id: changelog
        run: |
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          changelog="fastlane/metadata/android/en-US/changelogs/$code.txt"
          if [ ! -s "$changelog" ]; then
            echo "::error file=$changelog::missing changelog for versionCode $code"
            exit 1
          fi
          echo "path=$changelog" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true
          cache: true
          minimum_release_age: 7d
      - name: Check formatting, lint and test
        run: gradle -PcheckDependencyVersions check
      - name: Check fastlane metadata
        uses: ./.github/actions/fastlane
      - name: Build unsigned release APK
        run: gradle assembleRelease
      - name: Stage unsigned APK
        id: stage
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/keyholm-unsigned.apk dist/
          sum=$(sha256sum dist/keyholm-unsigned.apk | cut -d' ' -f1)
          echo "::notice title=Unsigned APK sha256::$sum"
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Cosign the unsigned APK
        run: |
          cosign sign-blob --yes \
            --bundle dist/keyholm-unsigned.apk.sigstore.json \
            dist/keyholm-unsigned.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyholm-unsigned.apk
          archive: false
          path: dist/keyholm-unsigned.apk
      - name: Create draft release with unsigned APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
          CHANGELOG: ${{ steps.changelog.outputs.path }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          printf "## What's Changed\n\n" > dist/notes.md
          cat "$CHANGELOG" >> dist/notes.md
          printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n\n' "$REPO" "$PREVIOUS_TAG" "$TAG" >> dist/notes.md
          cat >> dist/notes.md <<EOF
          ## Artifacts

          | | |
          |-|-|
          | \`keyholm.apk\` | the release APK, signed with the release key |
          | \`keyholm-unsigned.apk\` | the reproducible build output, before signing |
          | \`keyholm-unsigned.apk.sigstore.json\` | keyless Sigstore bundles proving the APK was produced by this workflow |
          | \`keyholm.apk.sigstore.json\` | keyless Sigstore bundles proving the APK was verified by this workflow |

          The signed APK's ZIP payload is byte-identical to \`keyholm-unsigned.apk\`.
          Only the APK Signing Block differs. See the workflow run for the recorded SHA-256 of each.

          ## Verify provenance

          Install [cosign](https://docs.sigstore.dev/cosign/installation/):

          \`\`\`bash
          SHA=${SHA}
          # Or if you have a local clone
          # SHA=\$(git rev-parse "${TAG}^{commit}")

          gh release download ${TAG}

          cosign verify-blob \\
            --bundle keyholm.apk.sigstore.json \\
            --certificate-identity-regexp '^https://github\.com/${REPO}/\.github/workflows/release\.yml@' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-github-workflow-sha \$SHA \\
            keyholm.apk

          cosign verify-blob \\
            --bundle keyholm-unsigned.apk.sigstore.json \\
            --certificate-identity-regexp '^https://github\.com/${REPO}/\.github/workflows/release\.yml@' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-github-workflow-sha \$SHA \\
            keyholm-unsigned.apk
          \`\`\`

          Both APKs also have [build provenance attestations](https://github.com/${REPO}/attestations):

          \`\`\`bash
          gh attestation verify keyholm.apk \\
            --repo ${REPO} \\
            --signer-workflow ${REPO}/.github/workflows/release.yml \\
            --source-digest \$SHA

          gh attestation verify keyholm-unsigned.apk \\
            --repo ${REPO} \\
            --signer-workflow ${REPO}/.github/workflows/release.yml \\
            --source-digest \$SHA
          \`\`\`

          ## Verify the APK signature

          \`\`\`bash
          apksigner verify --print-certs -v keyholm.apk
          \`\`\`

          ## Verify reproducibility

          \`\`\`bash
          git checkout ${TAG}
          mise install
          mise exec -- gradle assembleRelease

          sha256sum keyholm-unsigned.apk app/build/outputs/apk/release/keyholm-unsigned.apk
          \`\`\`
          EOF

          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release view "$TAG" --json body --jq .body > dist/existing-notes.md
            printf '\n' >> dist/existing-notes.md
            cat dist/notes.md >> dist/existing-notes.md
            gh release edit "$TAG" --draft --target "$SHA" --notes-file dist/existing-notes.md
            gh release upload "$TAG" --clobber \
              dist/keyholm-unsigned.apk dist/keyholm-unsigned.apk.sigstore.json
          else
            gh release create "$TAG" \
              --draft \
              --target "$SHA" \
              --title "$TAG" \
              --notes-file dist/notes.md \
              dist/keyholm-unsigned.apk dist/keyholm-unsigned.apk.sigstore.json
          fi

  reproduce-fdroid:
    needs: build
    uses: ./.github/workflows/reproduce-fdroid.yml
    with:
      unsigned_sha256: ${{ needs.build.outputs.unsigned_sha256 }}

  verify:
    needs: [build, reproduce-fdroid]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true
          cache: true
          minimum_release_age: 7d
      - name: Download unsigned and signed APKs from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ needs.build.outputs.tag }}" --repo "${{ github.repository }}" \
            --pattern keyholm-unsigned.apk --dir dist
          gh release download "${{ needs.build.outputs.tag }}" --repo "${{ github.repository }}" \
            --pattern keyholm.apk --dir dist
      - name: Signed APK differs from the reproducible build only by its signature
        run: |
          unsigned=$(sha256sum dist/keyholm-unsigned.apk | cut -d' ' -f1)
          signed=$(sha256sum dist/keyholm.apk | cut -d' ' -f1)
          echo "::notice title=Unsigned APK sha256::$unsigned"
          echo "::notice title=Signed APK sha256::$signed"
          mise exec -- apksigcopier compare dist/keyholm.apk dist/keyholm-unsigned.apk --unsigned
          echo "OK: signed release matches the unsigned reproducible build"
      - name: Show signer certificate
        run: mise exec -- apksigner verify --print-certs -v dist/keyholm.apk
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Cosign the signed APK (keyless)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cosign sign-blob --yes \
            --bundle dist/keyholm.apk.sigstore.json \
            dist/keyholm.apk
          gh release upload "${{ needs.build.outputs.tag }}" --repo "${{ github.repository }}" \
            dist/keyholm.apk.sigstore.json
      - name: Attest build provenance of both APKs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/keyholm-unsigned.apk
            dist/keyholm.apk
