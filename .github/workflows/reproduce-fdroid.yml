name: Reproducible F-Droid build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      unsigned_sha256:
        description: SHA-256 of the unsigned release APK
        type: string
        required: true

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
      sha256: ${{ inputs.unsigned_sha256 || steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read version from build.gradle.kts
        id: version
        run: |
          {
            echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
            echo "code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)"
          } >> "$GITHUB_OUTPUT"
      - if: ${{ !inputs.unsigned_sha256 }}
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true
          cache: true
          minimum_release_age: 7d
      - name: Build unsigned release APK
        if: ${{ !inputs.unsigned_sha256 }}
        id: build
        run: |
          gradle assembleRelease
          sum=$(sha256sum app/build/outputs/apk/release/keyholm-unsigned.apk | cut -d' ' -f1)
          echo "::notice title=Unsigned APK sha256::$sum"
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"

  fdroid:
    needs: reference
    runs-on: ubuntu-latest
    container: registry.gitlab.com/fdroid/fdroidserver:buildserver
    defaults:
      run:
        shell: bash -l -eo pipefail {0}
    steps:
      - name: Get fdroidserver and fdroiddata
        run: |
          git clone --depth 1 https://gitlab.com/fdroid/fdroidserver
          git clone --depth 1 https://gitlab.com/fdroid/fdroiddata
      - name: Point the newest build at this commit
        working-directory: fdroiddata
        env:
          SHA: ${{ github.sha }}
          NAME: ${{ needs.reference.outputs.name }}
          CODE: ${{ needs.reference.outputs.code }}
        shell: python3 {0}
        run: |
          import os
          from ruamel.yaml import YAML

          yaml = YAML()
          path = "metadata/app.keyholm.yml"
          with open(path) as f:
              app = yaml.load(f)
          build = app["Builds"][-1]
          build["versionName"] = os.environ["NAME"]
          build["versionCode"] = int(os.environ["CODE"])
          build["commit"] = os.environ["SHA"]
          # Temporary until the recipe with these lines is merged into fdroiddata
          build["sudo"] = [
              "apt-get update",
              "apt-get install -y openjdk-25-jdk-headless rustup gcc libc-dev yq",
              "update-alternatives --auto java",
          ]
          build["init"] = [
              'sdkmanager "ndk;$(tomlq -r .versions.ndk ../gradle/libs.versions.toml)"',
              """cargo install cargo-ndk --locked --version "$(tomlq -r '.tools."cargo:cargo-ndk"[0].version' ../mise.lock)\"""",
          ]
          app.pop("Binaries", None)
          with open(path, "w") as f:
              yaml.dump(app, f)
          with open("sudo.sh", "w") as f:
              f.writelines(line + "\n" for line in build.get("sudo") or [])
      - name: Run the recipe's sudo steps
        working-directory: fdroiddata
        run: bash -eux sudo.sh
      - name: Build with fdroid
        working-directory: fdroiddata
        run: |
          export PATH="$GITHUB_WORKSPACE/fdroidserver:$PATH" PYTHONPATH="$GITHUB_WORKSPACE/fdroidserver"
          fdroid build -v --stop -l app.keyholm
      - name: Compare with the reference build
        working-directory: fdroiddata
        env:
          CODE: ${{ needs.reference.outputs.code }}
          EXPECTED: ${{ needs.reference.outputs.sha256 }}
        run: |
          actual=$(sha256sum "unsigned/app.keyholm_$CODE.apk" | cut -d' ' -f1)
          echo "::notice title=F-Droid unsigned APK sha256::$actual"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::F-Droid build $actual doesn't match reference build $EXPECTED"
            exit 1
          fi
      - name: Scan the APK with fdroid scanner
        working-directory: fdroiddata
        env:
          CODE: ${{ needs.reference.outputs.code }}
        run: |
          export PATH="$GITHUB_WORKSPACE/fdroidserver:$PATH" PYTHONPATH="$GITHUB_WORKSPACE/fdroidserver"
          fdroid scanner --verbose --exit-code "unsigned/app.keyholm_$CODE.apk"
