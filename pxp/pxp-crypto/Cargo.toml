[package]
name = "pxp-crypto"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
jni = "0.22"
# Pinned to snow's versions.
p256 = { version = "0.13.2", features = ["ecdh"] }
aes = { version = "0.8", features = ["zeroize"] }
# Avoid snow 0.10.0's "std" feature enabling optional ring, blake2 and chacha
snow = { version = "0.10", default-features = false, features = ["default-resolver-crypto", "use-p256"] }
hkdf = "0.12.4"
hmac = "0.12.1"
sha2 = "0.10.9"
zeroize = "1.9.1"

[profile.release]
strip = true

[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
assertions_on_result_states = "deny"
pedantic = "deny"
str_to_string = "deny"
return_and_then = "deny"
redundant_test_prefix = "deny"
unused_result_ok = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
